# This workflow is managed by gh actions-lock.

name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.1.0
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
